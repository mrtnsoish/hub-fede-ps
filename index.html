<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hub Fédé PS</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b2430;--mu:#6b7686;--ac:#2f5bd8;--bd:#e2e6ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b222b;--tx:#e8ecf2;--mu:#93a0b2;--ac:#7ea2ff;--bd:#2a3340}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b222b;--tx:#e8ecf2;--mu:#93a0b2;--ac:#7ea2ff;--bd:#2a3340}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px}
.hero{margin-bottom:14px}
.date{color:var(--mu);margin:2px 0 10px}.date::first-letter{text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:6px 14px;font-size:.9rem;color:var(--tx);text-decoration:none;font-variant-numeric:tabular-nums}
.chip.big{font-weight:600;font-size:1.1rem}
.sub{color:var(--mu);margin:0 0 16px;font-size:.9rem}
input,button{font:inherit;color:var(--tx)}
input{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
.bar{display:flex;gap:8px;margin-bottom:18px;justify-content:flex-end}
button{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:10px 14px;cursor:pointer}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:22px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.item{display:flex;align-items:center;gap:6px}
.item a{flex:1;display:block;padding:13px 14px;background:var(--card);border:1px solid var(--bd);border-radius:12px;color:var(--tx);text-decoration:none;font-weight:500;min-width:0}
.item a small{display:block;color:var(--mu);font-weight:400;font-size:.75rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item a:active{border-color:var(--ac)}
.del{padding:8px 10px;color:#d33}
#form{display:none;gap:8px;flex-direction:column;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:18px}
#form.on{display:flex}
.empty{color:var(--mu);text-align:center;padding:30px 0}
@media(max-width:600px){
html,body{height:100%;overflow:hidden}
main{height:100%;display:flex;flex-direction:column;padding:12px 12px 14px}
h1{font-size:1.3rem}
.date{font-size:.85rem;margin:0 0 6px}
.hero{margin-bottom:0}
.sub{margin:8px 0;font-size:.8rem}
#list{flex:1;min-height:0;display:flex}
.grid{flex:1;min-height:0;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:8px}
.item{min-height:0}
.item a{display:flex;align-items:center;height:100%;padding:4px 10px;font-size:.88rem;line-height:1.2}
.item a small{display:none}
}
</style>
</head>
<body>
<main>
<section class="hero">
<h1 id="hello">Bonjour Martin</h1>
<div id="date" class="date"></div>
<div class="chips"><span id="clock" class="chip big"></span><span id="week" class="chip"></span></div>
</section>
<p class="sub">Hub Fédé PS</p>
<div id="list"></div>
</main>
<script>
var KEY="hub-fede-ps-v16";
var DEF=[
{t:"Gmail",u:"https://mail.google.com",c:"Au quotidien"},
{t:"Drive",u:"https://drive.google.com",c:"Au quotidien"},
{t:"Qomon",u:"https://qomon.app/login",c:"Au quotidien"},
{t:"Adhésion en ligne",u:"https://adhesion.parti-socialiste.fr/",c:"Adhérents"},
{t:"Site national",u:"https://parti-socialiste.fr/",c:"Parti socialiste"},
{t:"Ressources militantes",u:"https://ressources-militantes.parti-socialiste.fr/login.php",c:"Au quotidien"},
{t:"Service-public.fr",u:"https://www.service-public.gouv.fr/particuliers/vosdroits/R51788",c:"Administration"},
{t:"Tours Métropole – demande de maintenance",u:"https://formulaires.services.tours-metropole.fr/infra-telecom/demande-maintenance-ou-depose/",c:"Administration"},
{t:"Ville de Blois – annuaire SIR",u:"https://www.blois.fr/annuaire/services-municipaux/sir",c:"Administration"},
{t:"Smash (transfert)",u:"https://fromsmash.com/fr",c:"Outils"},
{t:"Framatoolbox",u:"https://framatoolbox.org/abc/fr/",c:"Outils"},
{t:"Canva",u:"https://www.canva.com/fr_fr/",c:"Outils"},
];
var links,editing=false;
function load(){try{var s=localStorage.getItem(KEY);if(s){var a=JSON.parse(s);if(Array.isArray(a))return a}}catch(e){}return DEF.slice()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(links))}catch(e){}}
function host(u){try{return new URL(u).hostname.replace(/^www\./,"")}catch(e){return u}}
function render(){
var box=document.getElementById("list");box.textContent="";
var g=document.createElement("div");g.className="grid";var n=0;
links.forEach(function(l,i){
n++;var d=document.createElement("div");d.className="item";
var a=document.createElement("a");a.href=l.u;a.target="_blank";a.rel="noopener noreferrer";
a.textContent=l.t;var s=document.createElement("small");s.textContent=host(l.u);a.appendChild(s);
d.appendChild(a);
if(editing){var b=document.createElement("button");b.className="del";b.textContent="✕";b.setAttribute("aria-label","Supprimer");
b.onclick=function(){links.splice(i,1);save();render()};d.appendChild(b)}
g.appendChild(d)});
if(!n){var e=document.createElement("div");e.className="empty";e.textContent="Aucun lien.";box.appendChild(e)}else box.appendChild(g)}
function wk(d){var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));var n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);var y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)}
function tick(){var d=new Date();
document.getElementById("hello").textContent=(d.getHours()>=18?"Bonsoir":"Bonjour")+" Martin";
document.getElementById("date").textContent=d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
document.getElementById("clock").textContent=d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
document.getElementById("week").textContent="Semaine "+wk(d)}
tick();setInterval(tick,15000);
links=load();render();
</script>
</body>
</html>
